services:
  - type: web
    name: ghost-cloud-relay
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GHOST_SECRET
        generateValue: true
      - key: SITE_URL
        value: https://www.arabic.chat
      - key: SOCKET_PATH
        value: /io/
