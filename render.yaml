services:
  - type: web
    name: ghost-cloud-relay
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GHOST_SECRET
        generateValue: true
      - key: GHOST_STORAGE_KEY
        generateValue: true
      - key: SITE_URL
        value: https://www.arabic.chat
      - key: SOCKET_PATH
        value: /io/
      - key: ALLOWED_ORIGINS
        value: https://www.arabic.chat,https://arabic.chat,chrome-extension://jcjomphigiocbjjkpfilpmkpcoghabii
